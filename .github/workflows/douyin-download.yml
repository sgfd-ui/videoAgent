name: douyin-download

on:
  push:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          python -m pip install -U playwright
      - name: Fetch target inside browser session
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from playwright.sync_api import sync_playwright

          AWEME_ID='7682230527038746447'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.6 Mobile/15E148 Safari/604.1'
          captured=[]

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for v in obj.values():
                      yield from walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from walk(v)

          def find_item(obj):
              for d in walk(obj):
                  aid=str(d.get('aweme_id') or d.get('awemeId') or d.get('id') or '')
                  if aid==AWEME_ID and isinstance(d.get('video'), dict):
                      return d
              return None

          def extract_urls(item):
              out=[]
              video=item.get('video') or {}
              for key in ['play_addr_h264','play_addr','download_addr']:
                  n=video.get(key) or {}
                  for u in n.get('url_list') or []:
                      if isinstance(u,str) and u.startswith('http') and u not in out:
                          out.append(u.replace('/playwm/','/play/').replace('playwm','play'))
              for br in video.get('bit_rate') or []:
                  for key in ['play_addr','play_addr_265']:
                      n=br.get(key) or {}
                      for u in n.get('url_list') or []:
                          if isinstance(u,str) and u.startswith('http') and u not in out:
                              out.append(u.replace('/playwm/','/play/').replace('playwm','play'))
              return out

          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-blink-features=AutomationControlled'])
              ctx=browser.new_context(user_agent=UA,locale='zh-CN',viewport={'width':390,'height':844})
              page=ctx.new_page()

              def on_response(resp):
                  try:
                      u=resp.url
                      ct=(resp.headers.get('content-type') or '').lower()
                      if ('/aweme/' in u or '/web/api/' in u) and 'json' in ct:
                          try:
                              data=resp.json()
                              item=find_item(data)
                              if item:
                                  captured.append(item)
                                  print('CAPTURED_TARGET_API=',u[:500])
                          except Exception:
                              pass
                  except Exception:
                      pass

              page.on('response',on_response)
              url=f'https://www.iesdouyin.com/share/video/{AWEME_ID}/'
              page.goto(url,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_timeout(10000)
              print('PAGE_URL=',page.url)
              print('PAGE_TITLE=',page.title())

              item=captured[0] if captured else None
              if not item:
                  result=page.evaluate('''async (id) => {
                    const u='https://www.douyin.com/aweme/v1/web/aweme/detail/?aweme_id='+id+'&device_platform=webapp&aid=6383';
                    try {
                      const r=await fetch(u,{credentials:'include',headers:{'Accept':'application/json','Referer':'https://www.douyin.com/'}});
                      const text=await r.text();
                      return {status:r.status,text};
                    } catch(e) { return {status:0,text:String(e)}; }
                  }''',AWEME_ID)
                  print('DIRECT_API_STATUS=',result.get('status'))
                  print('DIRECT_API_PREFIX=',(result.get('text') or '')[:1000])
                  try:
                      data=json.loads(result.get('text') or '')
                      item=find_item(data)
                  except Exception:
                      item=None

              if not item:
                  browser.close()
                  raise RuntimeError('Browser session did not obtain target aweme JSON')

              author=(item.get('author') or {}).get('nickname') or ''
              desc=item.get('desc') or ''
              duration=(item.get('video') or {}).get('duration') or item.get('duration') or 0
              meta={'aweme_id':str(item.get('aweme_id') or AWEME_ID),'author':author,'desc':desc,'duration_ms':duration}
              print('TARGET_META=',json.dumps(meta,ensure_ascii=False))
              open('metadata.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=2))

              urls=extract_urls(item)
              print('VIDEO_URL_COUNT=',len(urls))
              if not urls:
                  browser.close()
                  raise RuntimeError('Target JSON had no playable video URLs')

              ok=False
              for i,u in enumerate(urls[:20]):
                  try:
                      print('TRY_VIDEO=',i,u[:500])
                      resp=ctx.request.get(u,headers={'Referer':'https://www.douyin.com/','User-Agent':UA},timeout=60000)
                      print('VIDEO_STATUS=',i,resp.status,resp.headers.get('content-type'),resp.headers.get('content-length'))
                      if resp.ok:
                          body=resp.body()
                          print('VIDEO_BYTES=',i,len(body))
                          if len(body)>100000:
                              open('douyin_video.mp4','wb').write(body)
                              ok=True
                              break
                  except Exception as e:
                      print('VIDEO_ERR=',i,repr(e))
              browser.close()

          if not ok:
              raise RuntimeError('Failed to download target video from extracted URLs')

          subprocess.run(['ffmpeg','-y','-i','douyin_video.mp4','-vn','-ac','1','-ar','16000','audio.wav'],check=True)
          PY
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 douyin_video.mp4 | tee video_duration.txt
          ls -lh douyin_video.mp4 audio.wav metadata.json video_duration.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-result
          path: |
            douyin_video.mp4
            audio.wav
            metadata.json
            video_duration.txt
          if-no-files-found: warn
