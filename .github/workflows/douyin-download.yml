name: douyin-download

on:
  push:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Parse and download via live API
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          share='https://v.douyin.com/8Ox-gCkNV6M/'
          api='https://apis.jxcxin.cn/api/douyin?'+urllib.parse.urlencode({'url':share})
          req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read()
          print(body[:1200].decode('utf-8','replace'))
          open('parser_response.json','wb').write(body)
          data=json.loads(body)
          d=data.get('data') or data
          video_url=d.get('url') or d.get('video') or d.get('play_url')
          if isinstance(video_url,dict):
              video_url=video_url.get('url') or video_url.get('play_url')
          if not isinstance(video_url,str) or not video_url.startswith('http'):
              raise RuntimeError(f'No video URL in parser response: {data}')
          print('VIDEO_URL=',video_url[:500])
          req=urllib.request.Request(video_url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.douyin.com/'})
          with urllib.request.urlopen(req,timeout=90) as r, open('douyin_video.mp4','wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
          print('SIZE=',os.path.getsize('douyin_video.mp4'))
          PY
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 douyin_video.mp4 | tee video_duration.txt
          ffmpeg -y -i douyin_video.mp4 -vn -ac 1 -ar 16000 audio.wav
          ls -lh douyin_video.mp4 audio.wav

      - name: Transcribe audio
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -U faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          model=WhisperModel('small', device='cpu', compute_type='int8')
          segments,info=model.transcribe('audio.wav', beam_size=5, vad_filter=True)
          lines=[]
          print('DETECTED_LANGUAGE=',info.language,'PROB=',info.language_probability)
          for s in segments:
              line=f'[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}'
              print(line); lines.append(line)
          open('transcript.txt','w',encoding='utf-8').write('\n'.join(lines))
          open('language.txt','w',encoding='utf-8').write(f'{info.language}\t{info.language_probability}\n')
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-result
          path: |
            douyin_video.mp4
            audio.wav
            video_duration.txt
            transcript.txt
            language.txt
            parser_response.json
          if-no-files-found: warn
