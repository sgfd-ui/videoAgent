name: douyin-download

on:
  push:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download public Douyin video without cookies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          import urllib.request
          url='https://raw.githubusercontent.com/wyy1581672587-dot/douyin-public-downloader/main/douyin_public_downloader.py'
          data=urllib.request.urlopen(url, timeout=30).read()
          open('douyin_public_downloader.py','wb').write(data)
          PY
          printf '%s\n' 'https://v.douyin.com/8Ox-gCkNV6M/' > links.txt
          python douyin_public_downloader.py \
            --links links.txt \
            --output ./downloads \
            --state ./state.json \
            --log ./download_log.csv \
            --retry 2
          VIDEO=$(find downloads -type f -name '*.mp4' | head -n 1)
          test -n "$VIDEO"
          cp "$VIDEO" douyin_video.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 douyin_video.mp4 | tee video_duration.txt
          ffmpeg -y -i douyin_video.mp4 -vn -ac 1 -ar 16000 audio.wav
          ls -lh douyin_video.mp4 audio.wav

      - name: Transcribe audio
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -U faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          model=WhisperModel('small', device='cpu', compute_type='int8')
          segments,info=model.transcribe('audio.wav', beam_size=5, vad_filter=True)
          lines=[]
          print('DETECTED_LANGUAGE=',info.language,'PROB=',info.language_probability)
          for s in segments:
              line=f'[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}'
              print(line)
              lines.append(line)
          open('transcript.txt','w',encoding='utf-8').write('\n'.join(lines))
          open('language.txt','w',encoding='utf-8').write(f'{info.language}\t{info.language_probability}\n')
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-result
          path: |
            douyin_video.mp4
            audio.wav
            video_duration.txt
            transcript.txt
            language.txt
            state.json
            download_log.csv
          if-no-files-found: warn
