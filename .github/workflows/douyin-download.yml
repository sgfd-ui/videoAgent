name: douyin-download

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: douyin-result
          path: prior
          github-token: ${{ github.token }}
          run-id: 34377594972
      - name: Fast segmented ASR
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -U faster-whisper
          python - <<'PY'
          import wave, os, numpy as np
          from faster_whisper import WhisperModel
          with wave.open('prior/audio.wav','rb') as w:
              rate=w.getframerate(); x=np.frombuffer(w.readframes(w.getnframes()),dtype=np.int16)
          spans=[(0.35,3.30),(3.50,6.48),(6.55,10.10),(10.02,13.86),(13.82,18.94),(19.15,21.29)]
          os.makedirs('segments',exist_ok=True)
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8')
          out=[]
          for i,(a,b) in enumerate(spans,1):
              p=f'segments/{i:02d}.wav'; y=x[int(a*rate):int(b*rate)]
              with wave.open(p,'wb') as z:
                  z.setnchannels(1); z.setsampwidth(2); z.setframerate(rate); z.writeframes(y.tobytes())
              segs,info=model.transcribe(p,beam_size=5,vad_filter=False,temperature=0.0,condition_on_previous_text=False,task='transcribe')
              ss=list(segs); txt=' '.join(s.text.strip() for s in ss).strip()
              avg=sum(s.avg_logprob for s in ss)/len(ss) if ss else -99
              line=f'SEG{i} lang={info.language} p={info.language_probability:.4f} logp={avg:.4f}: {txt}'
              print(line); out.append(line)
          open('fast_segments.txt','w',encoding='utf-8').write('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-segmented-asr
          path: fast_segments.txt
          if-no-files-found: warn
