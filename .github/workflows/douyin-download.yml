name: douyin-download

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: douyin-result
          path: prior
          github-token: ${{ github.token }}
          run-id: 34377594972

      - name: Qwen3 ASR dialect cross-check
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -U 'sherpa-onnx>=1.13.4' soundfile numpy
          wget -q --show-progress https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25.tar.bz2
          tar xf sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25.tar.bz2
          python - <<'PY'
          import json
          import soundfile as sf
          import sherpa_onnx

          d='sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25'
          rec=sherpa_onnx.OfflineRecognizer.from_qwen3_asr(
              conv_frontend=f'{d}/conv_frontend.onnx',
              encoder=f'{d}/encoder.int8.onnx',
              decoder=f'{d}/decoder.int8.onnx',
              tokenizer=f'{d}/tokenizer',
              num_threads=4,
              debug=False,
          )
          audio,sr=sf.read('prior/audio.wav',dtype='float32',always_2d=False)
          if getattr(audio,'ndim',1)>1: audio=audio[:,0]
          if sr != 16000: raise RuntimeError(sr)

          def dec(x,max_tokens='192'):
              s=rec.create_stream()
              s.accept_waveform(sr,x)
              try:
                  s.set_option('max_new_tokens',max_tokens)
              except Exception:
                  pass
              rec.decode_stream(s)
              return s.result.text

          out={'full':dec(audio)}
          spans=[(0.0,4.0),(3.5,8.0),(7.5,12.0),(11.5,16.0),(15.5,21.29)]
          out['segments']=[]
          for a,b in spans:
              out['segments'].append({'start':a,'end':b,'text':dec(audio[int(a*sr):int(b*sr)],'96')})
          spans2=[(0.0,3.5),(3.5,7.0),(7.0,10.5),(10.5,14.0),(14.0,17.5),(17.5,21.29)]
          out['short_segments']=[]
          for a,b in spans2:
              out['short_segments'].append({'start':a,'end':b,'text':dec(audio[int(a*sr):int(b*sr)],'96')})
          with open('qwen_wenzhou.txt','w',encoding='utf-8') as f:
              f.write('FULL:\n'+out['full']+'\n\nSEGMENTS:\n')
              for r in out['segments']: f.write(f"[{r['start']:.2f}-{r['end']:.2f}] {r['text']}\n")
              f.write('\nSHORT:\n')
              for r in out['short_segments']: f.write(f"[{r['start']:.2f}-{r['end']:.2f}] {r['text']}\n")
          with open('qwen_wenzhou.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(open('qwen_wenzhou.txt',encoding='utf-8').read())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-wenzhou-asr
          path: |
            qwen_wenzhou.txt
            qwen_wenzhou.json
          if-no-files-found: warn
