name: douyin-download

on:
  push:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download Douyin video
        shell: bash
        run: |
          set -x
          yt-dlp --version
          URL_SHORT='https://v.douyin.com/8Ox-gCkNV6M/'
          URL_LONG='https://www.douyin.com/video/7682230527038746447'
          yt-dlp -v --no-playlist -o 'douyin_video.%(ext)s' "$URL_SHORT" || \
          yt-dlp -v --no-playlist -o 'douyin_video.%(ext)s' "$URL_LONG"
          VIDEO=$(find . -maxdepth 1 -type f -name 'douyin_video.*' | head -n 1)
          test -n "$VIDEO"
          ffmpeg -y -i "$VIDEO" -vn -ac 1 -ar 16000 audio.wav
          ls -lh "$VIDEO" audio.wav
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-result
          path: |
            douyin_video.*
            audio.wav
          if-no-files-found: warn
